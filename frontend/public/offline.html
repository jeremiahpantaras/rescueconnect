<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>RescueConnect | No connection</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
    main { max-width: 26rem; text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 .75rem; }
    p { color: #cbd5e1; line-height: 1.6; margin: 0 0 1rem; }
    a.button { display: inline-block; background: #3b82f6; color: #fff; text-decoration: none; padding: .85rem 1.5rem; border-radius: .6rem; font-weight: 600; }
    .note { font-size: .85rem; color: #94a3b8; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>This page needs a connection</h1>
    <p>RescueConnect cannot open this page without a signal. You can still make a new report: it is saved on your phone and sent automatically when you are back in range.</p>
    <a class="button" href="/">Open RescueConnect</a>
    <p class="note">If you are in immediate danger, call 911 or your local emergency hotline.</p>
  </main>
</body>
</html>
